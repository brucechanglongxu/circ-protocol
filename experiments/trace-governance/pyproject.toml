[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "circ-trace-governance"
version = "0.1.0"
description = "Trace-based evaluation of independent governance controls for clinical AI agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
analysis = [
    "matplotlib>=3.8,<4",
]
dev = [
    "matplotlib>=3.8,<4",
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
circ-trace = "circ_trace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"